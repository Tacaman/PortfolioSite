<section id="beyond"><div class="wrap"><div class="section-heading"><div><span class="mono muted" data-en="04 / Off the clock" data-pt="04 / Fora do trabalho"></span><h2 data-en="Beyond the Circuit" data-pt="Para além do circuito"></h2></div></div><div class="offwork-grid"><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5L2 9Zm4 2v5c3 3 9 3 12 0v-5m4-2v7"/></svg></span><h3 data-en="Teaching. Tutoring. Sharing knowledge." data-pt="Ensinar, dar explicações e partilhar conhecimento."></h3><p data-en="I was a teaching assistant in introductory electronics and Electrical Machines labs at FEUP. After graduating, I tutored university students in circuits, electronics, MATLAB and C/C++. I like helping others get comfortable with topics I know well." data-pt="Fui assistente nas aulas práticas de introdução à eletrónica e de Máquinas Elétricas na FEUP. Depois de acabar o curso, dei explicações de circuitos, eletrónica, MATLAB e C/C++ a alunos do ensino superior. Gosto de ajudar os outros a ganhar confiança em temas que conheço bem."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H10M12 9h5v5h-5zM13 7v2m3-2v2m-3 5v2m3-2v2m1-5h2m-2 2h2M7 3v4h3V3a4.5 4.5 0 0 1 0 8v9H7v-9a4.5 4.5 0 0 1 0-8z"/></svg></span><h3 data-en="Electronics repair" data-pt="Reparar eletrónica"></h3><p data-en="Old consoles, monitors, laptops: if something breaks, I like opening it up, figuring out what went wrong and seeing if I can bring it back to life. Especially if I get to desolder and solder a few things." data-pt="Consolas antigas, monitores, portáteis: quando algo avaria, gosto de o abrir, perceber o que aconteceu e tentar pô-lo a funcionar outra vez. Melhor ainda se tiver de dessoldar e soldar umas coisas."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2M3 13h4v7H4a1 1 0 0 1-1-1zm18 0h-4v7h3a1 1 0 0 0 1-1z"/></svg></span><h3 data-en="Music" data-pt="Música"></h3><p data-en="Classic rock was the soundtrack to family car rides. From there I found prog rock, metal and even pop, and picked up guitar and drums along the way. I’m no pro, and if nobody’s listening, I might even sing while I play. Pink Floyd is probably my favourite band." data-pt="O rock clássico era a banda sonora das viagens de carro em família. Depois descobri o rock progressivo, o metal e até a pop, e aprendi a tocar guitarra e bateria. Não sou profissional e, quando ninguém está a ouvir, até tento cantar enquanto toco. Pink Floyd é provavelmente a minha banda favorita."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zm0 6 4 3-1.5 5h-5L8 11zM12 2v6m4 3 5-2m-6.5 7 3 4m-8-4-3 4M8 11 3 9"/></svg></span><h3 data-en="Football" data-pt="Futebol"></h3><p data-en="I grew up watching matches and trying to copy what I saw when I played with friends. I still try to play two or three times a month. I was never a Ronaldo, but I follow SL Benfica religiously." data-pt="Cresci a ver jogos e a tentar imitar, com os meus amigos, o que via na televisão. Ainda tento jogar duas ou três vezes por mês. Nunca fui nenhum Ronaldo, mas acompanho religiosamente os jogos do SL Benfica."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v4m3-7v10m3-12v14m8-14v14m3-12v10m3-7v4M8 12h8"/></svg></span><h3 data-en="Gym" data-pt="Ginásio"></h3><p data-en="I don’t love the gym, but I go three times a week. It comes in handy when I’m carrying groceries, moving furniture or picking up whatever I just dropped. It also helps balance out all those calories from trying new dishes and restaurants." data-pt="Não adoro o ginásio, mas vou três vezes por semana. Dá jeito para carregar as compras, mudar móveis ou apanhar o que acabei de deixar cair. Também ajuda a compensar as calorias de experimentar pratos e restaurantes novos."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM2 13h2m16 0h2M8 8c0-2 2-2 2-5m4 5c0-2 2-2 2-5"/></svg></span><h3 data-en="Cooking" data-pt="Cozinhar"></h3><p data-en="I enjoy trying new recipes and make plenty of mistakes in the kitchen. But that’s part of the fun." data-pt="Gosto de experimentar receitas novas e faço muitas asneiras na cozinha. Mas faz parte da diversão."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3zM13 7a3 3 0 0 1 3-3h5v14h-5a3 3 0 0 0-3 3"/></svg></span><h3 data-en="Reading" data-pt="Leitura"></h3><p data-en="I read about personal development, finance and entrepreneurship, but I also enjoy getting lost in alternative realities. Brave New World and 1984 are two favourites." data-pt="Leio sobre desenvolvimento pessoal, finanças e empreendedorismo, mas também gosto de me perder em realidades alternativas. Admirável Mundo Novo e 1984 são dois dos meus favoritos."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20 9 7l4 7 3-5 6 11H2zM7 11l2 2 2-2M14.5 11.5l1.5 2 1.5-2"/></svg></span><h3 data-en="Hiking" data-pt="Caminhadas"></h3><p data-en="I enjoy long walks, whether through a city or around a park. But what I really love is a challenge out in nature. Every so often, I need a long hike, a few hills to climb and some fresh air." data-pt="Gosto de dar caminhadas longas, seja pela cidade ou num parque. Mas o que mais gosto é de um bom desafio na natureza. De vez em quando, preciso de fazer uma caminhada longa, subir e descer uns montes e respirar ar puro."></p></article></div></div></section>

function setLanguage(value){language=value;document.documentElement.lang=language==='pt'?'pt-PT':'en';document.querySelectorAll('[data-aria-en]').forEach(el=>el.setAttribute('aria-label',el.dataset[language==='pt'?'ariaPt':'ariaEn']));document.querySelectorAll('[data-en]').forEach(el=>el.innerHTML=el.dataset[language]);const toggle=document.getElementById('language-toggle');toggle.textContent=language==='en'?'PT':'EN';toggle.setAttribute('aria-label',language==='en'?'Mudar para português':'Switch to English');const i=language==='en'?0:1;document.getElementById('jobs').innerHTML=jobs.map((job,n)=>`<article id="job-${job.id}" class="job${job.current?' job-current':''}"><div class="job-date">${job.date[i]}${job.current?`<span class="current">● ${i===0?'CURRENT':'FUNÇÃO ACTUAL'}</span>`:''}</div><div><h3>${job.role[i]}</h3><div class="company"><img class="company-logo logo-${job.id}" src="data:image/webp;base64,${job.logo}" alt="${job.logoOnly?esc(job.company):''}">${job.logoOnly?'':esc(job.company)}</div><p>${job.text[i]}</p></div><div class="job-index">0${n+1}</div></article>`).join('');renderDiagram();renderProjects();updateThemeButton();}
const portfolioCases=[{"title":["Mitigating reactive-power restart spikes","Mitigação de picos de potência reativa no rearranque"],"org":"Capgemini Engineering (Vestas)","tags":"control embedded","goal":["Reduce abrupt reactive-power changes when turbines restart after a particular stop condition.","Reduzir variações bruscas de potência reativa no rearranque de turbinas após uma condição de paragem específica."],"work":["Traced the interaction between the power plant controller (PPC) and the converter, identified the cause of the spikes and corrected the C logic that reports reactive-power capability in specific operating states.","Analisei a interação entre o controlador do parque eólico (PPC) e o conversor, identifiquei a causa dos picos e corrigi a lógica em C que comunica ao PPC os limites de potência reativa do conversor em determinados estados de funcionamento."],"test":["Verified reactive-power reporting in converter/PPC emulation, followed by field verification with the people who reported the issue.","Verifiquei os limites comunicados ao PPC em emulação conjunta do conversor e do PPC. A correção foi depois verificada no terreno com a equipa que reportou o problema."],"result":["Corrected capability reporting and mitigated restart spikes. This may help in grid compliance tests and reduce electrical stress during restart.","Corrigi o reporte de capacidade e mitiguei os picos no rearranque. Isto poderá ajudar em ensaios de conformidade com a rede e reduzir o esforço elétrico no arranque."],"id":"case-reactive","date":"2026","tools":["Visual Studio Code (C), Vestas Graph Visualizer, Git and wind turbine/converter emulation.","Visual Studio Code (C), Vestas Graph Visualizer, Git e emulação de turbina/conversor."]},{"id":"case-parameters","date":"2026","org":"Capgemini Engineering (Vestas)","tags":"control","title":["Multi-site Converter Parameter Correction","Correção de parâmetros de conversores em vários parques"],"goal":["Correct grid-code-related converter settings across multiple wind farms in Finland.","Corrigir parâmetros dos conversores relacionados com o código de rede em vários parques eólicos na Finlândia."],"work":["Queried the turbine database to identify affected sites, clarified the required settings and corrected incomplete or incorrect values and conflicting override requests.","Consultei a base de dados de turbinas para identificar os parques afetados, confirmei os valores exigidos e corrigi parâmetros incompletos ou incorretos. Resolvi também pedidos de alteração de parâmetros que entravam em conflito."],"test":["Confirmed the affected sites and settings with the Finland customer representative who reported the issue.","Confirmei os parques afetados e os parâmetros com o representante do cliente na Finlândia que reportou o problema."],"result":["Aligned the converter settings at all identified Finnish sites with the applicable grid-code requirements.","Alinhei os parâmetros dos conversores de todos os parques finlandeses identificados com os requisitos aplicáveis do código de rede."],"tools":["SQL Server Management Studio 21 (SQL), Excel and Vestas’s centralised parameter management system.","SQL Server Management Studio 21 (SQL), Excel e sistema centralizado de gestão de parâmetros da Vestas."]},{"title":["Suppressing false startup alarms","Supressão de falsos alarmes no arranque"],"org":"Capgemini Engineering (Vestas)","tags":"control embedded","goal":["Prevent false converter startup alarms from causing unnecessary periods without production.","Evitar que falsos alarmes no arranque do conversor provoquem períodos desnecessários sem produção."],"work":["Queried field alarms under conditions associated with false events and traced the supervision logic. Corrected root causes where possible. Where that was not possible, implemented targeted startup suppression, including for asynchronous hardware and software initialisation.","Analisei registos de alarmes no terreno e a lógica de supervisão para identificar disparos indevidos. Corrigi a causa sempre que possível; nos restantes casos, implementei supressões específicas para o arranque, por exemplo quando o hardware e o software não terminavam a inicialização ao mesmo tempo."],"test":["Tested the corrections and suppressions in emulation and then on a real test turbine.","Testei as correções e supressões em emulação e depois numa turbina de ensaio."],"result":["Reduced periods of low production caused by false startup alarms.","Reduzi períodos de baixa produção provocados por falsos alarmes no arranque."],"id":"case-startup","date":"2026","tools":["SQL Server Management Studio 21 (SQL), Git, Visual Studio Code (C).","SQL Server Management Studio 21 (SQL), Git, Visual Studio Code (C)."]},{"title":["250 kW power module for MCS","Módulo de potência de 250 kW para carregamento MCS"],"org":"i-charging","tags":"power embedded hardware control","goal":["Develop an in-house 250 kW module for a modular Megawatt Charging System for heavy-duty EVs.","Desenvolver internamente um módulo de 250 kW para um sistema modular de carregamento de veículos elétricos pesados."],"work":["Contributed to circuit design, simulation, prototype debugging, board rework, control firmware and lab validation. Worked on STM firmware for acquisition, peripherals, MOSFET status and protection, OTA updates, supervision and power-converter control. Selected a DC/DC gate driver and designed an adapter PCB for connector adaptation and command and feedback level shifting.","Contribuí para o projeto e simulação dos circuitos, o diagnóstico de protótipos, o retrabalho de placas e a validação em laboratório. Desenvolvi firmware para microcontroladores STM, incluindo aquisição de sinais, controlo de periféricos, supervisão e proteção de MOSFETs, atualizações OTA e controlo dos conversores. Selecionei o circuito de acionamento (gate driver) do estágio DC/DC e projetei uma placa adaptadora para a interligação e a adaptação dos níveis dos sinais de comando e realimentação."],"test":["Open-loop tests with passive loads and closed-loop tests with bidirectional loads up to 500 kW, including two modules in parallel. Component replacement and prototype rework.","Testes em malha aberta com cargas passivas e em malha fechada com cargas bidireccionais até 500 kW, incluindo dois módulos em paralelo. Reparação e substituição de componentes de protótipos."],"result":["The team developed a 250 kW module ready to begin certification. Output ranges: 0–1250 V and 0–250 A, subject to the 250 kW power limit; maximum voltage and current are not simultaneous.","A equipa desenvolveu um módulo de 250 kW pronto para iniciar a certificação. Gamas de saída: 0–1250 V e 0–250 A, sujeitas ao limite de 250 kW; tensão e corrente máximas não são simultâneas."],"id":"case-mcs","date":"2023–2025","tools":["LTspice, PSIM, Altium, STM32CubeIDE, BUSMASTER/Kvaser (CAN); high-power bidirectional supply and load, bench supply, oscilloscope, multimeter, soldering station (including MCU replacement) and ST debugger.","LTspice, PSIM, Altium, STM32CubeIDE, BUSMASTER/Kvaser (CAN); fonte e carga bidirecionais de alta potência, fonte de bancada, osciloscópio, multímetro, estação de soldadura (incluindo substituição de microcontroladores) e depurador ST."]},{"title":["3.5 kW bidirectional DC/DC converter","Conversor DC/DC bidirecional de 3,5 kW"],"org":"Continental Engineering Services","tags":"power hardware","goal":["Supply 12 V and 24 V from a 48 V car battery.","Fornecer 12 V e 24 V a partir de uma bateria automóvel de 48 V."],"work":["Developed synchronous-buck schematics and documentation, simulated the circuits and analysed MOSFET losses for different parallel-device configurations.","Desenvolvi os esquemas e a documentação de um conversor buck síncrono. Simulei os circuitos e calculei as perdas nos MOSFETs para comparar configurações com dispositivos em paralelo."],"test":["Circuit simulation and review of technical documentation.","Simulação de circuitos e revisão da documentação técnica."],"result":["Delivered schematics, design documentation, simulation results and loss calculations.","Entreguei esquemas, documentação de projeto, resultados de simulação e cálculos de perdas."],"id":"case-automotive","date":"2023","tools":["Zuken CR5000, LTspice, MATLAB/Simulink, Excel.","Zuken CR5000, LTspice, MATLAB/Simulink, Excel."]},{"title":["Battery monitoring and balancing","Monitorização e balanceamento de células de bateria"],"org":"Continental Engineering Services","tags":"hardware","goal":["Improve the monitoring and balancing circuits of a battery management system (BMS).","Melhorar os circuitos de monitorização e balanceamento de um sistema de gestão de baterias (BMS)."],"work":["Reviewed schematics, researched monitoring and protection ICs, and proposed circuit changes. Evaluated temperature, overcurrent, cell-imbalance protection and balancing functions.","Revi os esquemas e avaliei circuitos integrados de monitorização e proteção. Propus alterações para melhorar o balanceamento entre células e a proteção contra sobrecorrente e temperaturas fora dos limites."],"test":["Simulated the proposed circuits using the supplier’s device model.","Simulei os circuitos propostos com o modelo do fabricante."],"result":["Proposed improvements to battery cell balancing, monitoring and protection.","Propus melhorias no balanceamento, monitorização e proteção das células."],"id":"case-bms","date":"2021–2022","tools":["LTspice, Zuken CR5000.","LTspice, Zuken CR5000."]},{"title":["Autonomous charging robot","Robô de carregamento autónomo"],"org":"Continental Engineering Services","tags":"hardware","goal":["Develop a ground-mounted robotic charger and its connection to an EV module.","Desenvolver um carregador robótico instalado no solo e a ligação ao módulo do veículo elétrico."],"work":["Supported the overall hardware architecture and developed vehicle-module subsystems, diagrams, documentation and schematics in a distributed team.","Apoiei a arquitetura global de hardware e desenvolvi subsistemas, diagramas, documentação e esquemas do módulo do veículo numa equipa distribuída."],"test":["Review and validation by the project lead.","Revisão e validação pelo responsável do projeto."],"result":["Defined the hardware architecture and core circuits.","Foram definidos a arquitetura de hardware e os circuitos de base."],"id":"case-robot","date":"2021–2022","tools":["Visio, Word, Zuken CR5000.","Visio, Word, Zuken CR5000."]},{"title":["Power Meter Evaluation","Avaliação de um medidor de potência"],"org":"Vestas","tags":"control hardware","goal":["Evaluate an alternative supplier power meter for a wind plant controller requested by a customer in Germany.","Avaliar um medidor de potência de outro fornecedor para o controlador de um parque eólico, a pedido de um cliente na Alemanha."],"work":["Compared the new meter’s documentation with that of the existing unit. Developed automated tests for active and reactive power and voltage tracking, response time, overshoot and oscillations.","Comparei a documentação do novo medidor com a do equipamento em serviço. Desenvolvi testes automatizados para avaliar o seguimento das referências de potência ativa, potência reativa e tensão, bem como o tempo de resposta, a sobreelevação e as oscilações."],"test":["Emulation with signal-generation equipment, followed by remote tests on a real wind farm in Germany.","Emulação com equipamento de geração de sinais, seguida de ensaios remotos num parque eólico na Alemanha."],"result":["Validated the alternative meter and documented poorer performance in several functions compared with the usual configuration.","Validei o medidor alternativo e documentei desempenho inferior em várias funções face à configuração habitual."],"id":"case-ppc","date":"2020–2021","tools":["C++, Studio 5000, Git.","C++, Studio 5000, Git."]},{"title":["Master’s Thesis: Bidirectional Converter Control","Tese de mestrado: controlo de um conversor bidirecional"],"org":"FEUP","tags":"power control","goal":["Model an isolated bidirectional dual half-bridge converter with independently controlled duty cycle and phase shift.","Modelar um conversor bidirecional isolado de dupla meia ponte, com controlo independente do ciclo de trabalho e do desfasamento."],"work":["Analysed the isolated dual half-bridge converter and derived power-transfer and transformer RMS-current relationships under duty-cycle and phase-shift control. Developed a two-time-scale averaged state-space model and studied its linearisation and MIMO control with PID and cross compensation.","Deduzi expressões para a potência transferida e a corrente eficaz no transformador em função do ciclo de trabalho e do desfasamento. Desenvolvi um modelo médio em espaço de estados com duas escalas de tempo e estudei a sua linearização e o controlo multivariável (MIMO) com PID e compensação cruzada."],"test":["Compared model predictions and control behaviour with detailed simulations, including the effects of switching frequency, terminal voltages and circuit R, L and C values. Successfully defended the thesis before a specialist panel.","Comparei as previsões do modelo e o comportamento do controlo com simulações detalhadas, incluindo o efeito da frequência de comutação, das tensões e dos valores de R, L e C. Defendi a tese perante um júri especializado."],"result":["Published the validated thesis, including converter modelling and a study of cross compensation on a simplified MIMO model.","Publiquei a tese validada, com a modelação do conversor e um estudo de compensação cruzada num modelo MIMO simplificado."],"id":"case-thesis","date":"2020","tools":["MATLAB/Simulink, PLECS, Maple, Overleaf (LaTeX).","MATLAB/Simulink, PLECS, Maple, Overleaf (LaTeX)."]},{"title":["AGV Navigation System and Team Coordination","Sistema de navegação de um AGV e coordenação de equipa"],"org":"FEUP · Academic / Académico","tags":"embedded control","goal":["Develop a simplified automated guided vehicle over six months in a ten-student team.","Desenvolver um veículo guiado automaticamente ao longo de seis meses, numa equipa de dez estudantes."],"work":["Helped define requirements, divide work and coordinate a ten-student team, including motivation and conflict management. Implemented straight-line navigation in C++ using Kalman-filter position estimates.","Ajudei a definir requisitos, dividir o trabalho e coordenar uma equipa de dez estudantes, incluindo motivação e gestão de conflitos. Implementei navegação em linha reta em C++ com estimativas de posição de um filtro de Kalman."],"test":["Integrated the navigation algorithm with position estimates and vehicle subsystems, then tested it on the AGV in the lab.","Integrei o algoritmo de navegação com as estimativas de posição e os subsistemas do veículo e testei o AGV em laboratório."],"result":["The prototype moved autonomously to designated points on the floor with acceptable accuracy.","O protótipo deslocava-se autonomamente até aos pontos indicados no chão com precisão aceitável."],"id":"case-agv","date":"2019","tools":["Visual Studio Code (C++), Taiga (team task tracking) and ROS (vehicle operation and subsystem communication).","Visual Studio Code (C++), Taiga (gestão de tarefas) e ROS (operação do veículo e comunicação entre subsistemas)."]},{"title":["480 W Formula Student Converter","Conversor de 480 W para Formula Student"],"org":"SDU · Erasmus","tags":"power hardware","goal":["Build and test an isolated Two-Switch Forward converter in a three-student team during Erasmus in Denmark.","Construir e testar um conversor isolado Two-Switch Forward numa equipa de três estudantes durante o Erasmus na Dinamarca."],"work":["Contributed to planning, topology comparison, loss analysis for semiconductors, passives and transformer, assembly, lab tests and analysis of results.","Contribuí para o planeamento, comparação de topologias, análise de perdas em semicondutores, passivos e transformador, montagem, ensaios e análise de resultados."],"test":["Laboratory tests on the converter prototype.","Ensaios em laboratório no protótipo do conversor."],"result":["Hands-on experience in converter design, prototyping and validation.","Experiência prática no projeto, prototipagem e validação de conversores."],"id":"case-formula","date":"2018","tools":["MATLAB/Simulink, Excel, Word; soldering station, multimeter, DC power supply, oscilloscope, passive loads and RLC analyser.","MATLAB/Simulink, Excel, Word; estação de soldadura, multímetro, fonte CC, osciloscópio, cargas passivas e analisador RLC."]},{"title":["Small-scale Factory Automation with PLC, SCADA and MES","Automação de uma fábrica em pequena escala com PLC, SCADA e MES"],"org":"FEUP · Academic / Académico","tags":"embedded control","goal":["Control production lines with conveyors, identification sensors and robotic tools.","Controlar linhas de produção com transportadores, sensores de identificação e ferramentas robóticas."],"work":["Programmed PLCs in Structured Text, Ladder, FBD and SFC to identify, move and process parts. Built a SCADA interface and a simplified C++ MES to manage product orders.","Programei PLCs em Structured Text, Ladder, FBD e SFC para identificar, transportar e processar peças. Criei uma interface SCADA e um MES simplificado em C++ para gerir encomendas."],"test":["Validated the PLC code, SCADA interface and MES first in the factory emulator and then on the physical production line in the university lab.","Validei o código de PLC, a interface SCADA e o MES no emulador e depois na linha de produção do laboratório da universidade."],"result":["Integrated production control, monitoring and order management. The course lecturer validated the system, and its database recorded operations and parts produced.","Integrei controlo de produção, monitorização e gestão de encomendas. O docente validou o sistema e a base de dados registou operações e peças produzidas."],"id":"case-plc","date":"2017","tools":["CODESYS, university PLC emulator, factory emulator, Visual Studio Code (C++), PostgreSQL accessed via the MES, and OPC UA between the MES and PLC.","CODESYS, emulador de PLC da universidade, emulador da linha de produção, Visual Studio Code (C++), PostgreSQL consultado através do MES e comunicação OPC UA entre o MES e o PLC."]}];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const projectGrid = document.getElementById('projects');
function equalizeProjectCards(){
 const summaries = [...projectGrid.querySelectorAll('.project > summary')];
 if (!summaries.length) {
  projectGrid.style.removeProperty('--project-card-height');
  return;
 }
 const tallest = Math.max(...summaries.map(summary => {
  const card = getComputedStyle(summary.parentElement);
  const edges = ['paddingTop','paddingBottom','borderTopWidth','borderBottomWidth'];
  return summary.getBoundingClientRect().height + edges.reduce((total, key) => total + parseFloat(card[key]), 0);
 }));
 const height = Math.ceil(tallest) + 'px';
 if (projectGrid.style.getPropertyValue('--project-card-height') !== height) {
  projectGrid.style.setProperty('--project-card-height', height);
 }
}
const projectSummaryObserver = new ResizeObserver(equalizeProjectCards);
function renderProjects(){
 const i=language==='en'?0:1;
 const labels=i?['O meu contributo','Validação','Resultado','Ferramentas'] : ['My contribution','Validation','Outcome','Tools'];
 const openIds=new Set([...document.querySelectorAll('.project[open]')].map(p=>p.id));
 const list=portfolioCases.filter(p=>projectFilter==='all'||p.tags.split(' ').includes(projectFilter));
 document.getElementById('project-count').textContent=list.length+(i?' projetos':' projects');
 document.getElementById('projects').innerHTML=list.map(p=>`<details class="project" id="${p.id}" ${openIds.has(p.id)?'open':''}><summary><span class="mono muted${p.org.toLowerCase()==='i-charging'?' project-org-original':''}">${esc(p.org.replace('Academic / Académico',i?'Académico':'Academic'))} · ${p.date}</span><h3>${esc(p.title[i])}</h3><p>${esc(p.goal[i])}</p><span class="open-label">${i?'Explorar caso +':'Explore case +'}</span></summary><div class="case-body">${['work','test','result','tools'].map((key,n)=>`<h4>${labels[n]}</h4><p>${esc(p[key][i])}</p>`).join('')}</div></details>`).join('');
 projectSummaryObserver.disconnect();
 projectGrid.querySelectorAll('.project > summary').forEach(summary => projectSummaryObserver.observe(summary));
 equalizeProjectCards();
 document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===projectFilter)));
}

 if(node&&(event.key==='Enter'||event.key===' ')){event.preventDefault();selectStage(node.dataset.stage);}
});
caseLink.addEventListener('click',event=>{
 event.preventDefault();
 const id=diagrams[diagramIndex].caseId;
 if(!document.getElementById(id)){projectFilter='all';renderProjects();}
 const card=document.getElementById(id);
 card.open=true;
 if(location.hash!=='#'+id)history.pushState(null,'','#'+id);
 card.querySelector('summary').focus({preventScroll:true});
 card.scrollIntoView({block:'start'});
});
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{projectFilter=btn.dataset.filter;renderProjects();}));
document.getElementById('language-toggle').addEventListener('click',()=>setLanguage(language==='en'?'pt':'en'));
const topButton=document.getElementById('back-to-top');
function updateTopButton(){topButton.hidden=window.scrollY<220;}
topButton.addEventListener('click',event=>{
 event.preventDefault();
 document.querySelector('header .brand').focus({preventScroll:true});
 if(location.hash)history.replaceState(null,'',location.pathname+location.search);
 window.scrollTo({top:0});
});
window.addEventListener('scroll',updateTopButton,{passive:true});
window.addEventListener('pageshow',updateTopButton);
setLanguage('en');
if(caseIds.includes(location.hash.slice(1)))document.getElementById(location.hash.slice(1)).open=true;
updateTopButton();

</script></body></html>
