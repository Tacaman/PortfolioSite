<section id="expertise"><div class="wrap"><div class="section-heading"><div><span class="mono muted" data-en="01 / Areas of expertise" data-pt="01 / Áreas de especialização"></span><h2 data-en="Three disciplines. One system." data-pt="Da electrónica de potência ao software de controlo."></h2><p class="section-note" data-en="Experience across design, simulation, implementation, laboratory testing, tools and equipment." data-pt="Experiência em design, simulação, implementação, validação, ferramentas e equipamento."></p></div></div><div class="domains"><article class="domain"><span class="number" data-en="01 / POWER" data-pt="01 / POTÊNCIA"></span><h3 data-en="Power Electronics" data-pt="Electrónica de potência"></h3><p data-en="Design, simulation and validation of AC/DC and DC/DC converters." data-pt="Design, simulação e validação de conversores AC/DC e DC/DC."></p><div class="tags"><span class="tag" data-en="Circuit Design" data-pt="Design de circuitos"></span><span class="tag">PLECS / PSIM / LTspice</span><span class="tag" data-en="HW Lab Equipment" data-pt="Equipamento de laboratório de HW"></span></div></article><article class="domain"><span class="number" data-en="02 / CONTROL" data-pt="02 / CONTROLO"></span><h3 data-en="Converter Control" data-pt="Controlo de conversores"></h3><p data-en="Implementation and tuning of control strategies for power converters in EV chargers, automotive applications and wind power generation." data-pt="Implementação e ajuste de estratégias de controlo para conversores de potência em carregadores de veículos eléctricos, aplicações automóveis e produção de energia eólica."></p><div class="tags"><span class="tag">MATLAB / Simulink</span><span class="tag">PLECS / PSIM</span></div></article><article class="domain"><span class="number" data-en="03 / EMBEDDED" data-pt="03 / SISTEMAS EMBEBIDOS"></span><h3 data-en="SW for Converters" data-pt="Software para conversores"></h3><p data-en="Microcontroller software development for power electronics applications, including control strategies, monitoring and protection, communications and peripheral control." data-pt="Desenvolvimento de software em microcontroladores para electrónica de potência, incluindo estratégias de controlo, monitorização e protecção, comunicações e controlo de periféricos."></p><div class="tags"><span class="tag">C / C++</span><span class="tag">SW/HW Debug</span><span class="tag" data-en="STM Microcontrollers" data-pt="Microcontroladores STM"></span></div></article></div></div></section>

<section id="experience"><div class="wrap"><div class="section-heading"><div><span class="mono muted" data-en="03 / Professional experience" data-pt="03 / Experiência profissional"></span><h2 data-en="A career in electronics &amp; engineering." data-pt="Um percurso em electrónica e engenharia."></h2><p class="section-note" data-en="From automotive electronics design to developing and testing EV fast-charging power modules and controlling wind parks and turbine converters, my experience spans a broad range of applications." data-pt="Desde o design de electrónica para veículos ao desenvolvimento e teste de módulos de potência para carregadores rápidos de carros eléctricos, passando pelo controlo ao nível do parque e da turbina eólica, a minha experiência é já bastante abrangente."></p></div></div><div id="jobs"></div></div></section>
<section id="toolkit" class="tinted"><div class="wrap"><div class="section-heading"><div><span class="mono muted" data-en="04 / Toolkit &amp; foundations" data-pt="04 / Competências técnicas e formação"></span><h2 data-en="Theory &amp; Tools." data-pt="Teoria e Ferramentas"></h2></div></div><div class="toolbox"><div><div class="tool-row"><span data-en="Circuit Simulation" data-pt="Simulação de circuitos"></span><p data-en="PLECS · MATLAB / Simulink · PSpice · LTspice · Multisim · PSIM" data-pt="PLECS · MATLAB / Simulink · PSpice · LTspice · Multisim · PSIM"></p></div><div class="tool-row"><span data-en="Hardware Design" data-pt="Design de Hardware"></span><p data-en="Altium · Zuken CR5000 · Schematic design" data-pt="Altium · Zuken CR5000 · Produção de esquemáticos"></p></div><div class="tool-row"><span data-en="Electronics Laboratory" data-pt="Laboratório de electrónica"></span><p data-en="Bench electronics tests · Board debugging · Board rework · Oscilloscope · Power supply · Waveform generator · Multimeter · Soldering equipment (including microscope work)" data-pt="Testes de electrónica em bancada · Diagnóstico de avarias em placas · Correcção de placas · Osciloscópio · Fonte de alimentação · Gerador de sinais · Multímetro · Equipamento de soldadura (incluindo trabalho ao microscópio)"></p></div><div class="tool-row"><span data-en="Programming" data-pt="Programação"></span><p data-en="C / C++ · Python · SQL · Microcontroller firmware (STM32) · CAN · PLC programming" data-pt="C / C++ · Python · SQL · Firmware para microcontroladores (STM32) · CAN · Programação de PLC"></p></div><div class="tool-row languages"><span class="language-heading" data-en="Languages" data-pt="Idiomas"></span><div class="language-levels"><span><b>PT</b> <span data-en="Native" data-pt="Nativo"></span></span> · <span><b>EN</b> C1</span> · <span><b>ES</b> B1</span> · <span><b>DE</b> A1</span></div></div></div><article class="education" id="education"><span class="mono muted">FEUP / 2015–2020</span><h3 data-en="Integrated MSc in Electrical Engineering" data-pt="Mestrado Integrado em Engenharia Electrotécnica e de Computadores"></h3><p data-en="Major in Automation — Power Electronics.<br>Focus on power converters, embedded systems, control and renewable energies." data-pt="Especialização em Automação — Electrónica de Potência.<br>Foco em conversores de potência, sistemas embebidos, controlo e energias renováveis."></p><div class="grade"><b><span data-en="16.7" data-pt="16.7"></span><span style="font-size:17px;color:var(--muted)"> / 20</span></b><span class="mono muted" data-en="Average grade" data-pt="Média final"></span></div><span class="mono muted">SDU / 2018–2019</span><h3 data-en="Erasmus · Odense, Denmark" data-pt="Erasmus · Odense, Dinamarca"></h3><p data-en="Embedded software design and isolated DC/DC power converters." data-pt="Desenvolvimento de software para sistemas embebidos e conversores DC/DC isolados."></p></article></div></div></section>
<section id="beyond"><div class="wrap"><div class="section-heading"><div><span class="mono muted" data-en="05 / Off the clock" data-pt="05 / Além trabalho"></span><h2 data-en="Beyond the Circuit" data-pt="Para lá do circuito"></h2></div></div><div class="offwork-grid"><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5L2 9Zm4 2v5c3 3 9 3 12 0v-5m4-2v7"/></svg></span><h3 data-en="Sharing knowledge" data-pt="Partilhar conhecimento"></h3><p data-en="Apart from being a teaching assistant at university, after graduating I tutored university students in circuits, electronics, MATLAB and C/C++. I truly believe I have a knack for passing my knowledge on to others." data-pt="Para além de ter sido assistente de professor na universidade, depois de concluir o curso dei explicações de circuitos, electrónica, MATLAB e C/C++ a alunos do ensino superior. Acredito que tenho facilidade (e jeito) para transmitir os meus conhecimentos aos outros."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H10M12 9h5v5h-5zM13 7v2m3-2v2m-3 5v2m3-2v2m1-5h2m-2 2h2M7 3v4h3V3a4.5 4.5 0 0 1 0 8v9H7v-9a4.5 4.5 0 0 1 0-8z"/></svg></span><h3 data-en="Electronics repair" data-pt="Reparar electrónica"></h3><p data-en="Old consoles, monitors, laptops: if something breaks, I like opening it up, figuring out what went wrong and seeing if I can bring it back to life. Especially if I get to desolder and solder a few components." data-pt="Consolas antigas, monitores, portáteis: quando algo avaria, gosto de o abrir, perceber o que aconteceu e tentar pô-lo a funcionar novamente. Melhor ainda se tiver de dessoldar e soldar uns componentes."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2M3 13h4v7H4a1 1 0 0 1-1-1zm18 0h-4v7h3a1 1 0 0 0 1-1z"/></svg></span><h3 data-en="Music" data-pt="Música"></h3><p data-en="Rock was always the default soundtrack to family car rides. Over the years I explored progressive rock, metal and even some pop rock. I learnt to play guitar and drums and, although I’m no professional, I really enjoy playing. When nobody’s listening, I even try singing a little. Pink Floyd is probably my favourite band." data-pt="O rock sempre foi o género musical por defeito nas viagens de carro em família. Ao longo dos anos, fui aprofundando o meu conhecimento ao descobrir o rock progressivo, o metal e até algum rock pop. Aprendi a tocar guitarra e bateria e, embora não seja nenhum profissional, gosto bastante de tocar. Quando ninguém está a ouvir, até tento cantar um pouco. Pink Floyd é provavelmente a minha banda favorita."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20zm0 6 4 3-1.5 5h-5L8 11zM12 2v6m4 3 5-2m-6.5 7 3 4m-8-4-3 4M8 11 3 9"/></svg></span><h3 data-en="Football" data-pt="Futebol"></h3><p data-en="I grew up watching matches and, when I played, trying to copy what I saw on TV. I still try to play two or three times a month. I was never a Ronaldo, but I follow SL Benfica religiously." data-pt="Cresci a ver muito futebol e, quando jogava, a tentar imitar o que via na televisão. Ainda tento jogar duas ou três vezes por mês. Nunca fui nenhum Ronaldo, mas acompanho religiosamente os jogos do SL Benfica."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v4m3-7v10m3-12v14m8-14v14m3-12v10m3-7v4M8 12h8"/></svg></span><h3 data-en="Gym" data-pt="Ginásio"></h3><p data-en="I don’t love the gym, but I try to go three or four times a week. It comes in handy when I’m carrying groceries, moving furniture or picking up whatever I just dropped. It also helps balance out all those calories from trying new dishes and restaurants." data-pt="Não adoro o ginásio, mas tento ir três ou quatro vezes por semana. O objectivo é estar preparado para carregar as compras, mudar móveis ou apanhar algo que deixei cair. Também ajuda a compensar as calorias ingeridas ao praticar outra das minhas actividades favoritas: experimentar pratos e restaurantes novos."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM2 13h2m16 0h2M8 8c0-2 2-2 2-5m4 5c0-2 2-2 2-5"/></svg></span><h3 data-en="Cooking" data-pt="Cozinhar"></h3><p data-en="I enjoy trying new recipes and make plenty of mistakes in the kitchen (but that’s part of the fun). To be honest, I love eating, and food is an important factor when choosing my next travel destination." data-pt="Gosto de experimentar receitas novas e faço muitas asneiras na cozinha (mas isso faz parte da diversão). Na verdade, gosto bastante de comer, e o turismo gastronómico é um factor importante na escolha do próximo sítio a visitar."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3zM13 7a3 3 0 0 1 3-3h5v14h-5a3 3 0 0 0-3 3"/></svg></span><h3 data-en="Reading" data-pt="Leitura"></h3><p data-en="I read about personal development, finance and entrepreneurship, but I also enjoy getting lost in alternative realities. <i>Brave New World</i> and <i>1984</i> are two favourites." data-pt="Leio sobre desenvolvimento pessoal, finanças e empreendedorismo, mas também gosto de me perder em realidades alternativas. <i>Admirável Mundo Novo</i> e <i>1984</i> são duas das minhas obras de referência."></p></article><article class="offwork-card"><span class="hobby-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20 9 7l4 7 3-5 6 11H2zM7 11l2 2 2-2M14.5 11.5l1.5 2 1.5-2"/></svg></span><h3 data-en="Hiking" data-pt="Caminhadas"></h3><p data-en="I enjoy long walks, whether through a city or out in nature. I like the challenge of walking for hours. Every so often, a long hike with a few hills to climb and some fresh air is all it takes to let go of a few worries." data-pt="As caminhadas longas são também uma das coisas que mais gosto de fazer. Seja enquanto visito uma nova cidade ou no meio da natureza, aprecio o desafio de caminhar durante horas. De vez em quando, subir e descer uns montes e respirar ar puro é tudo o que é preciso para esquecer alguns problemas."></p></article></div></div></section>

<script>
const themeToggle=document.getElementById('theme-toggle');
const themeSheet=document.getElementById('colour-theme');
function updateThemeButton(){
 const bg=darkPalette?'#101b1b':'#172638';
 const accent=darkPalette?'#d5fb74':'#66caff';
 const favicon=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="${bg}"/><text x="32" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-3" fill="${accent}">DR</text></svg>`;
 document.querySelector('link[rel="icon"]').href='data:image/svg+xml,'+encodeURIComponent(favicon);
 document.querySelector('meta[name="theme-color"]').content=bg;
 const pt=language==='pt';
 themeToggle.setAttribute('aria-pressed',String(darkPalette));
 themeToggle.setAttribute('aria-label',pt?'Modo escuro':'Dark mode');
 themeToggle.title=darkPalette?(pt?'Mudar para o modo claro':'Switch to light mode'):(pt?'Mudar para o modo escuro':'Switch to dark mode');
}
themeToggle.addEventListener('click',()=>{
 darkPalette=!darkPalette;
 themeSheet.href=darkPalette?'themes/green-black.css':'themes/blue.css';
 try{localStorage.setItem('dr-theme',darkPalette?'classic':'blue');}catch(e){}
 const url=new URL(location.href);
 if(url.searchParams.has('theme')){url.searchParams.delete('theme');history.replaceState(history.state,'',url);}
 updateThemeButton();
});

{date:['Sep 2023 — Dec 2025','Set 2023 — Dez 2025'],role:['Power Electronics Engineer','Engenheiro de Electrónica de Potência'],company:'i-charging',text:['Designed and simulated circuits and performed laboratory testing for AC/DC and DC/DC converters in an EV DC fast charger. Developed software for power electronics applications.','Projecto, simulação e testes em laboratório de conversores AC/DC e DC/DC para um carregador rápido de veículos eléctricos. Desenvolvimento de software para electrónica de potência.']},

const portfolioCases=[{"title":["Mitigating Reactive-power Spikes","Mitigação de picos de potência reactiva"],"org":"Capgemini Engineering (Vestas)","tags":"electronics software","goal":["Some turbines showed abrupt reactive-power variations when restarting after a stop, associated with incorrect reporting of reactive-power capability.","Em algumas turbinas foram detectadas variações bruscas de potência reactiva no rearranque após paragem, associadas a um reporte errado de capacidade de produção."],"work":["Analysed the interaction between the wind power plant controller (PPC) and converter, identified the cause of the spikes and corrected the C logic communicating reactive-power capability to the PPC in specific operating states.","Analisei a interacção entre o controlador do parque eólico (PPC) e o conversor, identifiquei a causa dos picos e corrigi a lógica em C que tratava da comunicação ao PPC da capacidade de produção de potência reactiva em determinados estados de funcionamento."],"test":["Verified the corrected values communicated to the PPC in a joint converter/PPC emulation environment. The correction was subsequently verified on turbines where the original issue had been reported.","Verifiquei a correcção dos valores comunicados ao PPC em ambiente de emulação conjunta do conversor e do PPC. A correcção foi posteriormente verificada no terreno em turbinas que haviam reportado o problema inicial."],"result":["Corrected capability reporting, mitigating restart spikes. This may help with grid-compliance tests and reduce stress during startup.","Corrigi o reporte de capacidade, o que permitiu mitigar os picos no rearranque. Isto poderá ajudar em ensaios de conformidade com a rede e reduzir o stress no arranque."],"id":"case-reactive","date":"2026","tools":["Visual Studio Code (C), Vestas Graph Visualizer, Git and wind turbine/converter emulation.","Visual Studio Code (C), Vestas Graph Visualizer, Git e emulação de turbina/conversor."]},{"id":"case-parameters","date":"2026","org":"Capgemini Engineering (Vestas)","tags":"software","title":["Converter Parameter Correction","Correcção de parâmetros de conversores"],"goal":["Several Finnish wind parks were identified with missing or incorrect parameters required to meet grid-connection requirements.","Foram identificados alguns parques eólicos na Finlândia que não apresentavam os parâmetros necessários para cumprir os requisitos de ligação à rede."],"work":["Queried the database covering all turbines to identify the affected parks, confirmed the required values and corrected incomplete or incorrect parameters. Also resolved conflicting parameter override requests.","Consultei a base de dados com informação de todas as turbinas para identificar os parques afectados, confirmei os valores exigidos e corrigi parâmetros incompletos ou incorrectos. Resolvi também pedidos de alteração de parâmetros que entravam em conflito."],"test":["Confirmed the affected parks and parameter corrections with the Finland representative who reported the issue.","Confirmei os parques afectados e a correcção dos parâmetros com o representante da Finlândia que reportou o problema."],"result":["Aligned converter parameters across all Finnish parks required to meet the country’s specific grid-connection requirements.","Alinhei os parâmetros dos conversores de todos os parques finlandeses que deveriam cumprir os requisitos específicos de ligação à rede no país."],"tools":["SQL Server Management Studio 21 (SQL), Excel and Vestas’s centralised parameter management system.","SQL Server Management Studio 21 (SQL), Excel e sistema centralizado de gestão de parâmetros da Vestas."]},{"title":["Suppressing False Startup Alarms","Supressão de alarmes falsos no arranque"],"org":"Capgemini Engineering (Vestas)","tags":"software validation","goal":["Multiple sites reported turbine alarms occurring only during startup and preventing production, leading to considerable financial losses.","Foi reportado por diversos parques que as turbinas emitiam alarmes apenas durante o arranque, impedindo que iniciassem a produção. Isto significava perdas monetárias consideráveis."],"work":["Analysed field alarm records and the logic of several supervision functions to identify incorrect fault reports. Where possible, corrected the cause directly in the code; otherwise, implemented targeted startup suppression.","Analisei registos de alarmes no terreno e a lógica de diversas supervisões para identificar situações de reporte incorrecto de anomalias. Quando possível, corrigi a causa directamente no código. Nos restantes casos, implementei supressões específicas para o arranque."],"test":["For each corrected supervision function, verified suppression of incorrect reports in emulation and then on a real test turbine.","Para cada supervisão identificada e corrigida, verifiquei a supressão dos reportes incorrectos em ambiente de emulação e depois numa turbina real de testes."],"result":["Reduced periods without production across several wind parks.","Foi possível reduzir os períodos de não produção em diversos parques."],"id":"case-startup","date":"2026","tools":["SQL Server Management Studio 21 (SQL), Git, Visual Studio Code (C) and converter emulation system.","SQL Server Management Studio 21 (SQL), Git, Visual Studio Code (C) e sistema de emulação do conversor."]},{"title":["250 kW Power Module for MCS","Módulo de potência de 250 kW para MCS"],"org":"i-charging","tags":"electronics software control validation","goal":["The team was tasked with developing an in-house 250 kW module for a modular high-power charging system for heavy-duty EVs: the Megawatt Charging System.","Foi pedido à equipa que desenvolvesse internamente um módulo de 250 kW para um sistema modular de carregamento de alta potência para veículos eléctricos pesados — Megawatt Charging System."],"work":["Worked across almost every project phase: circuit design and simulation; prototype-board debugging and rework; control firmware development; and complete-module lab validation. Developed STM microcontroller software for signal acquisition, peripheral control, MOSFET protection and control, OTA updates, supervision and converter control. Selected a DC/DC gate driver and designed the PCB layout of an adapter board.","Estive envolvido em praticamente todas as fases do projecto, contribuindo para o projecto e simulação de circuitos, diagnóstico de placas protótipo, correcção de placas, desenvolvimento de firmware de controlo e validação do módulo em laboratório. Desenvolvi software para microcontroladores STM para aquisição de sinais, controlo de periféricos, protecção e controlo de MOSFETs, actualizações OTA, supervisão e controlo dos conversores. Seleccionei um gate driver para o conversor DC/DC e desenhei o layout de uma placa adaptadora."],"test":["Alongside basic functional checks — injecting signals into board inputs and verifying readings and outputs — took part in open-loop tests with passive loads and closed-loop tests with bidirectional loads up to 500 kW, with two modules operating in parallel.","Além de validações simples de funcionamento — injecção de sinais nas entradas das placas e validação dos valores lidos e das saídas — participei em ensaios em malha aberta com cargas passivas e em malha fechada com cargas bidireccionais até 500 kW, com dois módulos a funcionar em paralelo."],"result":["The team developed a 250 kW module ready to begin certification. Output ranges: 0–1250 V and 0–250 A, subject to the 250 kW power limit. Two-module parallel operation was also confirmed; operation up to 1.25 MW remained to be validated.","A equipa desenvolveu um módulo de 250 kW pronto para iniciar a certificação. Gamas de saída: 0–1250 V e 0–250 A, sujeitas ao limite de 250 kW. Foi também confirmada a operação em paralelo de dois módulos; posteriormente, deveria ser validada a operação até 1.25 MW."],"id":"case-mcs","date":"2023–2025","tools":["LTspice, PSIM, Altium, STM32CubeIDE, BUSMASTER/Kvaser (CAN); high-power bidirectional supply and load, bench supply, oscilloscope, multimeter, soldering station (including MCU replacement) and ST debugger.","LTspice, PSIM, Altium, STM32CubeIDE, BUSMASTER/Kvaser (CAN); fonte e carga bidireccionais de alta potência, fonte de bancada, osciloscópio, multímetro, estação de soldadura (incluindo substituição de microcontroladores) e debugger de STM."]},{"title":["3.5 kW DC/DC Converter","Conversor DC/DC de 3.5 kW"],"org":"Continental Engineering Services","tags":"electronics","goal":["The company was asked to develop a 3.5 kW DC/DC converter for an electric vehicle, taking a 48 V battery input and providing 12 V and 24 V outputs for the vehicle electronics.","Foi pedido à empresa que desenvolvesse um conversor DC/DC de 3.5 kW para um veículo eléctrico, com entrada de 48 V a partir de uma bateria e duas saídas, a 12 V e 24 V, para alimentação da electrónica do veículo."],"work":["Developed schematics and converter documentation. Simulated selected circuits and calculated MOSFET losses for several parallel-device configurations to support selection of the most cost-effective solution.","Desenvolvi os esquemáticos e diversa documentação sobre o conversor. Simulei alguns circuitos e calculei as perdas nos MOSFETs para diversas configurações de dispositivos em paralelo, por forma a escolher a solução mais eficiente em termos económicos."],"test":["Circuit simulation and technical-documentation review by the technical lead.","Simulação de circuitos e revisão da documentação técnica pelo responsável técnico."],"result":["Delivered schematics, design documentation, simulation results and loss calculations.","Entreguei esquemáticos, documentação de projecto, resultados de simulação e cálculos de perdas."],"id":"case-automotive","date":"2023","tools":["Zuken CR5000, LTspice, MATLAB/Simulink, Excel.","Zuken CR5000, LTspice, MATLAB/Simulink, Excel."]},{"title":["Battery Cell Monitoring and Balancing","Monitorização e balanceamento de células de bateria"],"org":"Continental Engineering Services","tags":"electronics","goal":["Investigated ways to improve the monitoring and balancing circuit of a battery management system (BMS) for a project.","Foi-me pedido que investigasse formas de melhorar o circuito de monitorização e balanceamento de um sistema de gestão de baterias (BMS) para um projecto."],"work":["Reviewed the existing circuit and researched integrated monitoring and protection devices. Proposed changes to improve cell balancing and protection against overcurrent and out-of-range temperatures.","Revi e avaliei o circuito utilizado à época e investiguei circuitos integrados de monitorização e protecção. Propus alterações para melhorar o balanceamento entre células e a protecção contra sobrecorrente e temperaturas fora dos limites."],"test":["Simulated the proposed circuits using the manufacturer’s model.","Simulei os circuitos propostos com o modelo do fabricante."],"result":["Proposed improvements to BMS cell balancing, monitoring and protection.","Proposta de melhoria no balanceamento, monitorização e protecção das células do sistema BMS."],"id":"case-bms","date":"2021–2022","tools":["LTspice, Zuken CR5000.","LTspice, Zuken CR5000."]},{"title":["Autonomous Charging Robot","Robot de carregamento autónomo"],"org":"Continental Engineering Services","tags":"electronics","goal":["Contributed to an autonomous robotic charging system. After a vehicle parked over the system and validation was complete, a robotic arm would connect to it and initiate charging. The system comprised a ground-mounted module beside the charger and a vehicle-mounted module.","Estive envolvido num projecto de um sistema robotizado de ligação e carregamento autónomo entre carregador e veículo. Ao estacionar um carro sobre o sistema, após validação, um braço robótico deveria acoplar automaticamente ao veículo e iniciar a carga. O sistema foi dividido em dois módulos: um colocado no chão, junto a um carregador, e outro no próprio veículo."],"work":["Worked on the vehicle module in a distributed team. Supported the overall hardware architecture and developed subsystem documentation, including diagrams, schematics and explanatory text.","Trabalhei no módulo do veículo numa equipa distribuída. Apoiei o design da arquitectura global de hardware e desenvolvi documentação para diversos subsistemas: diagramas, esquemáticos e textos explicativos."],"test":["The project lead reviewed and validated the documentation.","A revisão e validação da documentação foram feitas pelo responsável do projecto."],"result":["Developed the hardware architecture and the core circuits of several subsystems.","Foram desenvolvidos a arquitectura de hardware e os circuitos base de alguns subsistemas."],"id":"case-robot","date":"2021–2022","tools":["Visio, Word, Zuken CR5000.","Visio, Word, Zuken CR5000."]},{"title":["Power Meter Evaluation","Avaliação de um medidor de potência"],"org":"Vestas","tags":"software validation","goal":["Evaluated wind park controller (PPC) performance with a meter different from the validated device used at most sites. This was a specific regional request requiring a particular device.","Fiquei encarregue de avaliar o desempenho do controlador de parque eólico (PPC) com um medidor de potência diferente do equipamento validado e utilizado na maioria dos parques. Foi um pedido expresso de uma região que exigia um dispositivo específico."],"work":["Compared the new meter’s documentation with that of the existing unit. Developed automated tests for active and reactive power and voltage reference tracking, response time, overshoot and oscillations.","Comparei a documentação do novo medidor com a do equipamento em serviço. Desenvolvi testes automatizados para avaliar o seguimento das referências de potência activa, potência reactiva e tensão, bem como o tempo de resposta, a sobreelevação (overshoot) e as oscilações."],"test":["Grid emulation using signal-generation equipment, followed by remote tests on a wind park in Germany.","Emulação da rede com equipamento de geração de sinais, seguida de ensaios remotos num parque eólico na Alemanha."],"result":["Validated the alternative meter and documented its performance against the usual configuration. The device was approved for use as required by the region.","Validei o medidor alternativo e documentei o seu desempenho em várias funções, por comparação com a configuração habitual. Foi permitida a utilização do equipamento, tal como exigido pela região."],"id":"case-ppc","date":"2020–2021","tools":["C++, Studio 5000, Git.","C++, Studio 5000, Git."]},{"title":["Master’s Thesis: Modelling and Control of a Bidirectional Converter","Tese de mestrado: Modelação e Controlo de um conversor bidireccional"],"org":"FEUP","tags":"electronics control","goal":["Analysed, modelled and developed a control loop for an isolated bidirectional dual half-bridge converter with independent duty-cycle and switching-signal phase-shift adjustment. The main aim was to assess the additional control freedom provided by varying the duty cycle, which was traditionally fixed at 50%.","O tema proposto foi analisar, modelar e desenvolver uma malha de controlo para um conversor bidireccional isolado, de topologia dual half-bridge, com ajuste independente do duty-cycle e do desfasamento dos sinais de comando. A ideia fundamental era avaliar o impacto do grau de liberdade adicional do controlo do duty-cycle, tradicionalmente fixado a 50%."],"work":["Derived expressions for transferred power and transformer RMS current as functions of duty cycle and phase shift. Developed a two-time-scale averaged state-space model and studied its linearisation and MIMO control with PID and cross compensation.","Deduzi expressões para a potência transferida e a corrente eficaz no transformador em função do duty-cycle e do desfasamento. Desenvolvi um modelo de média em espaço de estados com duas escalas de tempo e estudei a sua linearização e o controlo multivariável (MIMO) com PID e compensação cruzada."],"test":["Compared model operation and control behaviour with detailed simulations, including switching frequency, primary/secondary voltages and circuit R, L and C values. Defended the thesis before a specialist panel.","Comparei o funcionamento do modelo e o comportamento do controlo com simulações detalhadas, incluindo o impacto da frequência de comutação, das tensões no primário e no secundário e dos valores de R, L e C do circuito. Defendi a tese perante um júri especializado."],"result":["Published the validated thesis, including converter analysis and modelling and a simplified control system with cross compensation.","Publiquei a tese validada, com a análise e modelação do conversor e um sistema simplificado de controlo com compensação cruzada."],"id":"case-thesis","date":"2020","tools":["MATLAB/Simulink, PLECS, Maple, Overleaf (LaTeX).","MATLAB/Simulink, PLECS, Maple, Overleaf (LaTeX)."]},{"title":["Development of an Automated Guided Vehicle (AGV)","Desenvolvimento de um veículo autónomo industrial (AGV)"],"org":"FEUP · Academic / Académico","tags":"software validation","goal":["In the final year of the integrated master’s degree, worked in a team of ten students to develop an automated guided vehicle in just six months.","Durante o último ano do mestrado integrado, participei num projecto com uma equipa de dez estudantes. O nosso objectivo era desenvolver um veículo autónomo industrial (AGV) em apenas seis meses."],"work":["Took on a team leadership role, helping define requirements, allocate work and coordinate the team. Motivation and conflict management were major challenges. Implemented straight-line navigation in C++ using position estimates from a Kalman filter developed by another team member.","Assumi um dos papéis de liderança, ajudando a definir requisitos, dividir o trabalho e coordenar a equipa. A motivação e a gestão de conflitos foram dois dos principais desafios. Em termos técnicos, implementei um algoritmo de navegação em linha recta em C++, baseado em estimativas de posição de um filtro de Kalman desenvolvido por outro elemento da equipa."],"test":["Integrated the navigation algorithm with the other AGV subsystems and ran movement tests in the laboratory.","O algoritmo de navegação foi integrado no AGV, juntamente com os restantes subsistemas, e foram feitos testes de deslocação em laboratório."],"result":["Developed a simplified robotic prototype that moved autonomously to designated floor positions with acceptable accuracy.","No final, foi desenvolvido um protótipo simplificado de um robot que se deslocava autonomamente até aos pontos indicados no chão com precisão aceitável."],"id":"case-agv","date":"2019","tools":["Visual Studio Code (C++), Taiga (team task tracking) and ROS (vehicle operation and subsystem communication).","Visual Studio Code (C++), Taiga (gestão de tarefas) e ROS (operação do veículo e comunicação entre subsistemas)."]},{"title":["480 W Formula Student Converter","Conversor de 480 W para Formula Student"],"org":"SDU · Erasmus","tags":"electronics validation","goal":["During an Erasmus course in Denmark, a three-student team was tasked with developing the central power system for an electric Formula Student car. The team designed, built and tested an isolated Two-Switch Forward converter.","Durante o meu Erasmus na Dinamarca, foi-nos proposto, numa das cadeiras, desenvolver o sistema de potência central do carro eléctrico para a competição Formula Student. A equipa de três elementos desenvolveu, implementou e testou um conversor isolado de topologia Two-Switch Forward."],"work":["Contributed to planning, topology comparison, semiconductor/passive/transformer loss analysis, assembly, laboratory tests and analysis of results.","Contribuí para o planeamento, comparação de topologias, análise de perdas em semicondutores, passivos e transformador, montagem, testes de laboratório e análise de resultados."],"test":["Laboratory tests on the converter prototype.","Ensaios em laboratório do protótipo do conversor."],"result":["Implemented and validated the converter, while identifying scope for improvement.","Conversor implementado e com funcionamento validado, embora passível de melhorias."],"id":"case-formula","date":"2018","tools":["MATLAB/Simulink, Excel, Word; soldering station, multimeter, DC power supply, oscilloscope, passive loads and RLC analyser.","MATLAB/Simulink, Excel, Word; estação de soldadura, multímetro, fonte CC, osciloscópio, cargas passivas e analisador RLC."]},{"title":["Small-scale Factory Automation","Automação de uma fábrica em pequena escala"],"org":"FEUP · Academic / Académico","tags":"control software validation","goal":["For a master’s course, a four-student team developed control of a small-scale factory with conveyors, identification sensors and robotic tools. The brief included recording production and success statistics in a database, building a SCADA interface, and implementing high-level order management linked to a production optimisation algorithm.","Numa cadeira do mestrado, foi-nos pedido que, em equipas de quatro elementos, desenvolvêssemos o controlo de uma fábrica em pequena escala, com tapetes transportadores, sensores de identificação e ferramentas robóticas. Deveríamos ainda registar numa base de dados as peças trabalhadas e o sucesso das operações, desenvolver uma interface SCADA e implementar gestão de pedidos a alto nível, associada a um algoritmo de optimização da produção."],"work":["Helped plan and develop PLC control code in Structured Text, FBD and SFC for part identification, transport and processing. Contributed to the SCADA system and part of the simplified C++ MES.","Participei no planeamento e desenvolvimento do código de controlo das linhas em PLC, nas linguagens Structured Text, FBD e SFC, para identificar, transportar e processar peças. Ajudei no desenvolvimento do sistema SCADA e de parte do sistema MES simplificado, em C++."],"test":["Validated subsystems in simulation using course-provided software, then tested them together on the physical small-scale factory in the university laboratory.","Os subsistemas foram sendo validados em simulação com software fornecido pelo responsável da cadeira. Posteriormente, foram validados de forma integrada na fábrica real em pequena escala, no laboratório da faculdade."],"result":["Delivered an integrated factory control, optimisation and production-recording system, tested against lecturer-defined cases and validated by the lecturer.","Obtivemos um sistema completo de controlo, optimização e registo de uma fábrica em pequena escala, testado com os casos definidos pelo responsável da cadeira e validado pelo mesmo."],"id":"case-plc","date":"2017","tools":["CODESYS, university PLC emulator, factory emulator, Visual Studio Code (C++), PostgreSQL accessed via the MES, and OPC UA between the MES and PLC.","CODESYS, emulador de PLC da universidade, emulador da linha de produção, Visual Studio Code (C++), PostgreSQL consultado através do MES e comunicação OPC UA entre o MES e o PLC."]}];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const projectGrid = document.getElementById('projects');
function equalizeProjectCards(){
 const summaries = [...projectGrid.querySelectorAll('.project > summary')];
 if (!summaries.length) {
  projectGrid.style.removeProperty('--project-card-height');
  return;
 }
 summaries.forEach(summary=>{
  const footer=summary.querySelector('.project-footer');
  if(footer)summary.style.paddingBottom=Math.ceil(footer.getBoundingClientRect().height+22)+'px';
 });
 const tallest = Math.max(...summaries.map(summary => {
  const card = getComputedStyle(summary.parentElement);
  const edges = ['paddingTop','paddingBottom','borderTopWidth','borderBottomWidth'];
  return summary.getBoundingClientRect().height + edges.reduce((total, key) => total + parseFloat(card[key]), 0);
 }));
 const height = Math.ceil(tallest) + 'px';
 if (projectGrid.style.getPropertyValue('--project-card-height') !== height) {
  projectGrid.style.setProperty('--project-card-height', height);
 }
}
const projectSummaryObserver = new ResizeObserver(equalizeProjectCards);
function renderProjects(){
 const i=language==='en'?0:1;
 const tagLabels={electronics:['Electronics','Electrónica'],software:['Software','Software'],control:['Control','Controlo'],validation:['Validation','Validação']};
 const labels=i?['O meu contributo','Validação','Resultado','Ferramentas'] : ['My contribution','Validation','Outcome','Tools'];
 const openIds=new Set([...document.querySelectorAll('.project[open]')].map(p=>p.id));
 const list=portfolioCases.filter(p=>projectFilter==='all'||p.tags.split(' ').includes(projectFilter));
 document.getElementById('project-count').textContent=list.length+(i?' projectos':' projects');
 document.getElementById('projects').innerHTML=list.map(p=>`<details class="project" id="${p.id}" ${openIds.has(p.id)?'open':''}><summary><span class="mono muted${p.org.toLowerCase()==='i-charging'?' project-org-original':''}">${esc(p.org.replace('Academic / Académico',i?'Académico':'Academic'))} · ${p.date}</span><h3>${esc(p.title[i])}</h3><p>${esc(p.goal[i])}</p><span class="project-footer"><span class="project-tags">${p.tags.split(' ').map(tag=>`<span class="project-tag tag-${tag}">${tagLabels[tag][i]}</span>`).join('')}</span><span class="open-label">${i?'Explorar caso +':'Explore case +'}</span></span></summary><div class="case-body">${['work','test','result','tools'].map((key,n)=>`<h4>${labels[n]}</h4><p>${esc(p[key][i])}</p>`).join('')}</div></details>`).join('');
 projectSummaryObserver.disconnect();
 projectGrid.querySelectorAll('.project > summary').forEach(summary => {projectSummaryObserver.observe(summary);projectSummaryObserver.observe(summary.querySelector('.project-footer'));});
 equalizeProjectCards();
 document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===projectFilter)));
}

  stages:[[167,98,'AC / DC'],[305,98,'DC / DC']],controlX:236,feedbackX:405,
  power:["An AC/DC converter rectifies the grid voltage and a DC/DC converter regulates the output voltage and current according to vehicle requests.", "Conversor AC/DC para rectificação da tensão da rede e conversor DC/DC para regulação da tensão e correntes de saída de acordo com os pedidos do veículo."],

  control:['Measurement, monitoring and protection functions and a control strategy for generating both output voltages, implemented on microcontrollers.','Funções de medição, monitorização e protecção e estratégia de controlo para gerar as duas tensões de saída, implementadas em microcontroladores.']},

let diagramIndex=0, activeStage='power';
const svgContent=document.getElementById('diagram-content');

function schematicBlock(x,y,w,stage,label,subLabel=''){
 const h=stage==='control'?54:48;
 return '<g class="schematic-node" data-stage="'+stage+'" role="button" tabindex="0" aria-pressed="false" aria-label="'+esc(label+(subLabel?' / '+subLabel:''))+'"><rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="5"/><text class="label'+(stage==='control'?' controller-label':'')+'" x="'+x+'" y="'+(y+(subLabel?-3:5))+'" text-anchor="middle">'+esc(label)+'</text>'+(subLabel?'<text class="block-sub" x="'+x+'" y="'+(y+14)+'" text-anchor="middle">'+esc(subLabel)+'</text>':'')+'</g>';
}
function selectStage(stage){
 activeStage=stage;
 svgContent.querySelectorAll('[data-stage]').forEach(node=>{
  const active=node.dataset.stage===stage;
  node.dataset.active=String(active);
  node.setAttribute('aria-pressed',String(active));
 });
 svgContent.querySelector('.feedback-path').dataset.active=String(stage==='control');
 const i=language==='en'?0:1;
 document.getElementById('scope-title').textContent=(stage==='power'?['Power Electronics','Electrónica de Potência']:['Control Stage','Controlo'])[i];
 document.getElementById('scope-text').textContent=diagrams[diagramIndex][stage][i];
}
const diagramIcons={
 tower:'M4 26 12 2h4l8 24M7 20h14M9 14h10M2 10h24M5 5h18M7 20l12-6M21 20 9 14M8 26h12',
 plug:'M10 2v8m8-8v8M7 9h14v3a7 7 0 0 1-7 7v5c0 2-2 3-4 3H6',

};
function renderDiagram(){
 const d=diagrams[diagramIndex], i=language==='en'?0:1, wind=diagramIndex===2, mcs=diagramIndex===0;
 document.getElementById('diagram-title').textContent=d.title[i];
 document.querySelectorAll('[data-diagram]').forEach(btn=>btn.setAttribute('aria-pressed',String(Number(btn.dataset.diagram)===diagramIndex)));
 const terminal=(x,label,icon,anchor,interactive=false)=>`<g class="diagram-terminal${interactive?' terminal-power':''}" ${interactive?`data-stage="power" role="button" tabindex="0" aria-pressed="false" aria-label="${esc(label)}"`:''}><text class="terminal" x="${x}" y="29" text-anchor="${anchor}">${esc(label)}</text><path class="terminal-icon" transform="translate(${x+(anchor==='start'?0:-28)} 45)" d="${diagramIcons[icon]}"/></g>`;
 const controls=schematicBlock(d.controlX,178,128,'control',i?'CONTROLADOR':'CONTROLLER');
 const paths=wind?'M409 87V220H244V205 M244 151V111 M180 178H145V111 M308 178H343V111':
  mcs?'M405 87V220H236V205 M172 178H167V111 M300 178H305V111':
  'M382 87V178H304 M240 151V111';
 const pathHtml=paths.split(/(?=M)/).map(path=>`<path d="${path}" marker-end="url(#arrow)"/>`).join('');
 svgContent.innerHTML='<path class="power-line" d="M32 87H448"/><g class="feedback-path">'+pathHtml+'<circle cx="'+d.feedbackX+'" cy="87" r="3"/></g>'+
  terminal(22,d.source[i],d.icons[0],'start')+
  d.stages.map(([x,w,label])=>schematicBlock(x,87,w,'power',label)).join('')+
  terminal(458,d.output[i],d.icons[1],'end')+controls;
 caseLink.href='#'+d.caseId;
 selectStage(activeStage);
}
document.querySelectorAll('[data-diagram]').forEach(btn=>btn.addEventListener('click',()=>{
 diagramIndex=Number(btn.dataset.diagram);activeStage='power';renderDiagram();
}));
svgContent.addEventListener('click',event=>{
 const node=event.target.closest('[data-stage]');
 if(node){node.focus();selectStage(node.dataset.stage);}
});
svgContent.addEventListener('keydown',event=>{
 const node=event.target.closest('[data-stage]');
 if(node&&(event.key==='Enter'||event.key===' ')){event.preventDefault();selectStage(node.dataset.stage);}
});
caseLink.addEventListener('click',event=>{
 event.preventDefault();
 const id=diagrams[diagramIndex].caseId;
 if(!document.getElementById(id)){projectFilter='all';renderProjects();}
 const card=document.getElementById(id);
 card.open=true;
 if(location.hash!=='#'+id)history.pushState(null,'','#'+id);
 card.querySelector('summary').focus({preventScroll:true});
 card.scrollIntoView({block:'start'});
});
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{projectFilter=btn.dataset.filter;renderProjects();}));
document.getElementById('language-toggle').addEventListener('click',()=>setLanguage(language==='en'?'pt':'en'));
const topButton=document.getElementById('back-to-top');
let returningToTop=false;
function updateTopButton(){
 const y=Math.max(0,window.scrollY);
 if(y<=1)returningToTop=false;
 const visible=returningToTop?y>1:y>=220;
 topButton.dataset.visible=String(visible);
 topButton.setAttribute('aria-hidden',String(!visible));
 topButton.tabIndex=visible?0:-1;
 if(!visible&&document.activeElement===topButton)topButton.blur();
}
topButton.addEventListener('click',()=>{
 returningToTop=true;
 if(location.hash)history.replaceState(null,'',location.pathname+location.search);
 // Do not focus the sticky header: focus and scrolling are separate actions.
 window.scrollTo({top:0,left:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
 updateTopButton();
});
// A deliberate user scroll cancels the return without blocking normal gestures.
function cancelReturnToTop(){returningToTop=false;updateTopButton();}
window.addEventListener('wheel',cancelReturnToTop,{passive:true});
window.addEventListener('touchstart',event=>{
 if(!topButton.contains(event.target))cancelReturnToTop();
},{passive:true});
window.addEventListener('scroll',updateTopButton,{passive:true});
window.addEventListener('pageshow',updateTopButton);
window.addEventListener('resize',updateTopButton);
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',updateTopButton);
 window.visualViewport.addEventListener('scroll',updateTopButton);
}
let savedLanguage='en';
try{const storedLanguage=localStorage.getItem('dr-language');if(storedLanguage==='pt'||storedLanguage==='en')savedLanguage=storedLanguage;}catch(e){}
setLanguage(savedLanguage);
if(caseIds.includes(location.hash.slice(1)))document.getElementById(location.hash.slice(1)).open=true;
updateTopButton();
